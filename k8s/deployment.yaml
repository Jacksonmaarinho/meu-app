apiVersion: apps/v1
kind: Deployment
metadata:
  name: meu-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meu-app
  template:
    metadata:
      labels:
        app: meu-app
    spec:
      containers:
        - name: meu-app
          image: ghcr.io/jacksonmaarinho/meu-app:4560005f9f305808939ce8aec4961fbf6ec7e97f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
