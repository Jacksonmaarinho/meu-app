name: CI

on:
  push:
    branches: [main]
    paths: ["app/**"]

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ghcr.io/jacksonmaarinho/meu-app:${{ github.sha }}

      - name: Atualizar tag da imagem no manifest
        run: |
          sed -i "s|image: ghcr.io/jacksonmaarinho/meu-app:.*|image: ghcr.io/jacksonmaarinho/meu-app:${{ github.sha }}|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "deploy: ${{ github.sha }}"
          git push
